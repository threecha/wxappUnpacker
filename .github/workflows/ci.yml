name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.x
          - os: ubuntu-latest
            node: 24.x
          - os: windows-latest
            node: 24.x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - if: runner.os == 'Linux' && matrix.node == '24.x'
        run: npm run audit

  shell:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n bingo.sh de_miniapp.sh install.sh
